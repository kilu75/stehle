<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papieri-Areal – Stehle Animationsprototyp</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #111;
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
  display: flex; flex-direction: column; align-items: center;
  min-height: 100vh; padding: 36px 20px 60px; color: white;
}
.page-title {
  font-size: 11px; font-weight: 400; letter-spacing: .15em;
  text-transform: uppercase; color: #555; margin-bottom: 4px;
}
.page-subtitle { font-size: 13px; color: #888; margin-bottom: 28px; }

/* ── Tabs ── */
.tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; justify-content: center; }
.tab {
  padding: 8px 22px; border: 1px solid #333; background: transparent;
  color: #666; cursor: pointer; font-size: 12px; letter-spacing: .06em;
  transition: all .2s; border-radius: 2px; font-family: inherit;
}
.tab:hover { border-color: #555; color: #aaa; }
.tab.active { border-color: #aaa; color: white; background: rgba(255,255,255,.07); }

/* ── Speed ── */
.controls {
  display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
  font-size: 11px; color: #555; flex-wrap: wrap; justify-content: center;
}
.speed-btn {
  padding: 5px 14px; border: 1px solid #2a2a2a; background: transparent;
  color: #555; cursor: pointer; font-size: 11px; border-radius: 2px;
  font-family: inherit; transition: all .2s;
}
.speed-btn:hover { border-color: #555; color: #aaa; }
.speed-btn.active { border-color: #888; color: white; background: rgba(255,255,255,.06); }

/* ── Checkbox ── */
.opt-row {
  margin-bottom: 28px; font-size: 11px; color: #555;
  display: flex; flex-direction: column; gap: 10px; align-items: center;
}
.check-label {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  transition: color .2s; user-select: none;
}
.check-label:hover { color: #999; }
.check-label input[type=checkbox] {
  appearance: none; -webkit-appearance: none;
  width: 14px; height: 14px; border: 1px solid #444; border-radius: 2px;
  background: transparent; cursor: pointer; flex-shrink: 0;
  transition: all .2s; position: relative;
}
.check-label input[type=checkbox]:checked {
  background: #888; border-color: #aaa;
}
.check-label input[type=checkbox]:checked::after {
  content: ''; position: absolute; left: 3px; top: 1px;
  width: 5px; height: 8px; border: 1.5px solid white;
  border-left: none; border-top: none; transform: rotate(40deg);
}

/* ── Stehle ── */
.stehle {
  width: 260px; background: #060606;
  border-radius: 6px 6px 4px 4px; overflow: hidden;
  box-shadow: 0 40px 100px rgba(0,0,0,.85), 0 0 0 1px #1e1e1e;
}
.stehle-header {
  padding: 22px 0 18px; display: flex; justify-content: center;
  align-items: center; border-bottom: 1px solid #141414;
}
.papieri-logo { display: flex; align-items: center; gap: 9px; }
.logo-ii { display: flex; gap: 3px; align-items: flex-end; padding-bottom: 2px; }
.logo-ii span { display: block; width: 2.5px; background: white; border-radius: 1px; }
.logo-ii span:first-child { height: 22px; }
.logo-ii span:last-child  { height: 17px; }
.logo-wordmark { display: flex; flex-direction: column; line-height: 1; }
.logo-wordmark .main { font-size: 21px; font-weight: 800; letter-spacing: -.02em; color: white; }
.logo-wordmark .sub  { font-size: 7px; letter-spacing: .2em; color: #555; text-transform: uppercase; margin-top: 3px; }

/* Screen: flex column so top-banner + anim-wrapper stack */
.stehle-screen {
  height: 520px; background: #000;
  display: flex; flex-direction: column;
  overflow: hidden; position: relative;
}

/* ── Top banner: first 3 companies, always visible ── */
#top-banner {
  flex-shrink: 0;
  padding: 16px 16px 12px;
  border-bottom: 1px solid #1c1c1c;
}
.banner-item { padding: 2px 0; }
.bn { display: block; white-space: nowrap; color: white; line-height: 1.2; }
.bn-1 { font-size: 24px; font-weight: 800; letter-spacing: -.025em; }
.bn-2 { font-size: 19px; font-weight: 300; letter-spacing: -.01em; margin-top: 1px; }
.bn-3 { font-size: 19px; font-weight: 700; letter-spacing: -.01em; margin-top: 1px; }

/* ── Animation wrapper: fills remaining space ── */
.anim-wrapper {
  flex: 1;
  overflow: hidden;
  position: relative;
  min-height: 0; /* flex shrink fix */
}

.stehle-foot {
  height: 22px; background: #0b0b0b; border-top: 1px solid #141414;
  display: flex; align-items: center; justify-content: center;
}
.stehle-foot span { font-size: 7px; letter-spacing: .14em; text-transform: uppercase; color: #2e2e2e; }

/* ══════════════════════════════════════════════════════════
   SHARED l1 / l2 system
══════════════════════════════════════════════════════════ */
.l1, .l2 {
  display: block; white-space: nowrap; overflow: hidden; line-height: 1.2;
}

/* ══════════════════════════════════════════════════════════
   ANIMATION 1 · DOCK-ZOOM
══════════════════════════════════════════════════════════ */
#anim-dock {
  height: 100%; display: flex; flex-direction: column;
  justify-content: center; padding: 8px 16px;
}
.dock-item { padding: 1px 0; overflow: hidden; transition: padding .6s cubic-bezier(.25,.46,.45,.94); }

.dock-item .l1 {
  font-size: 10px; opacity: .28; font-weight: 400; color: white;
  transition: font-size .6s cubic-bezier(.25,.46,.45,.94),
              opacity    .6s cubic-bezier(.25,.46,.45,.94), font-weight .4s;
}
.dock-item .l2 {
  font-size: 0px; opacity: 0; color: white;
  transition: font-size .6s cubic-bezier(.25,.46,.45,.94),
              opacity    .6s cubic-bezier(.25,.46,.45,.94), font-weight .4s;
  transition-delay: .07s;
}
.dock-item.d3 .l1                  { font-size: 10.5px; opacity: .34; }
.dock-item.d2 .l1                  { font-size: 12px;   opacity: .48; }
.dock-item.d2 .l2                  { font-size: 12px;   opacity: .35; }
.dock-item.d1                      { padding: 2px 0; }
.dock-item.d1 .l1                  { font-size: 16px;   opacity: .68; }
.dock-item.d1 .l2                  { font-size: 16px;   opacity: .50; }
.dock-item.d0                      { padding: 6px 0; }
.dock-item.d0 .l1                  { font-size: 27px;   opacity: 1;   font-weight: 700; letter-spacing: -.02em; }
.dock-item.d0 .l2                  { font-size: 27px;   opacity: 1;   font-weight: 700; letter-spacing: -.02em; }

/* ══════════════════════════════════════════════════════════
   ANIMATION 2 · RASTER-HIGHLIGHT
══════════════════════════════════════════════════════════ */
#anim-grid { height: 100%; overflow: hidden; position: relative; }

.grid-inner {
  position: relative; padding: 8px 12px;
  transition: transform .7s cubic-bezier(.4,0,.2,1);
}
.grid-row { display: flex; align-items: center; overflow: visible; }
.grid-cell {
  flex: 1; min-width: 0; padding: 5px 4px; overflow: hidden; text-align: left;
  transition: transform .65s cubic-bezier(.4,0,.2,1), opacity .65s cubic-bezier(.4,0,.2,1);
}
.grid-cell .l1 {
  font-size: 10px; opacity: .40; font-weight: 400; color: white;
  transition: font-size .6s cubic-bezier(.4,0,.2,1), opacity .6s cubic-bezier(.4,0,.2,1), font-weight .4s;
}
.grid-cell .l2 {
  font-size: 8.5px; opacity: .26; font-weight: 400; color: white;
  transition: font-size .6s cubic-bezier(.4,0,.2,1), opacity .6s cubic-bezier(.4,0,.2,1), font-weight .4s;
  transition-delay: .07s;
}

/* Active: stays in column, text overflows right */
.grid-cell.cell-active {
  overflow: visible; position: relative; z-index: 5; padding: 9px 4px;
}
.grid-cell.cell-active .l1,
.grid-cell.cell-active .l2 { overflow: visible; }
.grid-cell.cell-active .l1 { font-size: 24px; opacity: 1; font-weight: 700; letter-spacing: -.02em; }
.grid-cell.cell-active .l2 { font-size: 24px; opacity: 1; font-weight: 700; letter-spacing: -.02em; }

/* Right column active: slide left so text starts at same x as left column */
.grid-cell.right-cell.cell-active  { transform: translateX(-100%); }

/* Partner displaced */
.grid-cell.cell-displaced { transform: translateY(var(--disp, -28px)); opacity: .10; }

/* Overview */
#anim-grid.overview .grid-cell {
  overflow: hidden !important; transform: none !important;
  opacity: 1 !important; padding: 5px 4px !important;
}
#anim-grid.overview .grid-cell .l1 {
  font-size: 10px !important; opacity: .62 !important;
  font-weight: 400 !important; letter-spacing: 0 !important;
}
#anim-grid.overview .grid-cell .l2 {
  font-size: 8.5px !important; opacity: .48 !important;
  font-weight: 400 !important; transition-delay: 0s !important;
}

/* Fade edges */
#anim-grid::before, #anim-grid::after {
  content: ''; position: absolute; left: 0; right: 0;
  height: 44px; z-index: 2; pointer-events: none;
}
#anim-grid::before { top: 0;    background: linear-gradient(to bottom, #000, transparent); }
#anim-grid::after  { bottom: 0; background: linear-gradient(to top,    #000, transparent); }

/* ══════════════════════════════════════════════════════════
   ANIMATION 3 · SPOTLIGHT-SCROLL
══════════════════════════════════════════════════════════ */
#anim-spotlight { height: 100%; overflow: hidden; position: relative; }
.spot-track {
  position: absolute; left: 0; right: 0; padding: 0 16px;
  transition: transform .75s cubic-bezier(.4,0,.2,1);
}
.spot-item { padding: 3px 0; overflow: hidden; }
.spot-item .l1 {
  font-size: 10px; opacity: .18; font-weight: 400; color: white;
  transition: font-size .7s cubic-bezier(.4,0,.2,1), opacity .7s cubic-bezier(.4,0,.2,1),
              font-weight .4s, letter-spacing .7s;
}
.spot-item .l2 {
  font-size: 0px; opacity: 0; color: white;
  transition: font-size .7s cubic-bezier(.4,0,.2,1), opacity .7s cubic-bezier(.4,0,.2,1), font-weight .4s;
  transition-delay: .09s;
}
.spot-item.sp-mid  .l1  { font-size: 10.5px; opacity: .30; }
.spot-item.sp-near .l1  { font-size: 12px;   opacity: .46; }
.spot-item.sp-near .l2  { font-size: 12px;   opacity: .36; }
.spot-item.sp-active    { padding: 12px 0; }
.spot-item.sp-active .l1 { font-size: 32px; opacity: 1; font-weight: 700; letter-spacing: -.025em; }
.spot-item.sp-active .l2 { font-size: 32px; opacity: 1; font-weight: 700; letter-spacing: -.025em; }

#anim-spotlight::before, #anim-spotlight::after {
  content: ''; position: absolute; left: 0; right: 0; z-index: 2; pointer-events: none;
}
#anim-spotlight::before { top: 0;    height: 90px; background: linear-gradient(to bottom, #000 25%, transparent); }
#anim-spotlight::after  { bottom: 0; height: 90px; background: linear-gradient(to top,    #000 25%, transparent); }

/* ── Description ── */
.desc-card {
  margin-top: 24px; width: 260px; padding: 14px 16px;
  border: 1px solid #1e1e1e; border-radius: 4px;
  font-size: 11px; line-height: 1.75; color: #505050;
}
.desc-card strong { color: #777; display: block; margin-bottom: 4px; font-size: 11.5px; }
</style>
</head>
<body>

<p class="page-title">Papieri-Areal Cham</p>
<p class="page-subtitle">Arealstele – Animationsprototyp</p>

<div class="tabs">
  <button class="tab active" onclick="switchAnim('dock',this)">① Dock-Zoom</button>
  <button class="tab"        onclick="switchAnim('grid',this)">② Raster-Highlight</button>
  <button class="tab"        onclick="switchAnim('spotlight',this)">③ Spotlight-Scroll</button>
</div>

<div class="controls">
  <span>Intervall:</span>
  <button class="speed-btn active" onclick="setSpeed(3000,this)">3 s (Demo)</button>
  <button class="speed-btn"        onclick="setSpeed(10000,this)">10 s</button>
  <button class="speed-btn"        onclick="setSpeed(25000,this)">25 s (Real)</button>
</div>

<div class="opt-row">
  <label class="check-label">
    <input type="checkbox" id="chk-top" onchange="toggleTopFixed(this.checked)">
    Hauptmieter oben fixiert (MIGROS / logitech / CLEVERfit)
  </label>
  <label class="check-label">
    <input type="checkbox" id="chk-random" onchange="toggleRandom(this.checked)">
    Zufällige Reihenfolge (statt linear)
  </label>
</div>

<div class="stehle">
  <div class="stehle-header">
    <div class="papieri-logo">
      <div class="logo-ii"><span></span><span></span></div>
      <div class="logo-wordmark">
        <span class="main">papieri</span>
        <span class="sub">Cham</span>
      </div>
    </div>
  </div>

  <div class="stehle-screen">

    <!-- Top banner: first 3 companies always visible (hidden by default) -->
    <div id="top-banner" style="display:none">
      <div class="banner-item"><span class="bn bn-1">MIGROS</span></div>
      <div class="banner-item"><span class="bn bn-2">logitech</span></div>
      <div class="banner-item"><span class="bn bn-3">CLEVERfit</span></div>
    </div>

    <!-- Animation area: fills remaining height -->
    <div class="anim-wrapper">
      <div id="anim-dock"></div>
      <div id="anim-grid" style="display:none">
        <div class="grid-inner" id="grid-inner"></div>
      </div>
      <div id="anim-spotlight" style="display:none">
        <div class="spot-track" id="spot-track"></div>
      </div>
    </div>

  </div>

  <div class="stehle-foot"><span>Parkplatz Knonauerstrasse</span></div>
</div>

<div class="desc-card" id="desc-card">
  <strong>① Dock-Zoom</strong>
  Alle Namen immer sichtbar. Der aktive Name vergrössert sich – L1 zuerst, L2 folgt. Graduelle Abstufung der Nachbarn, linearer Durchlauf.
</div>

<script>
const companies = [
  { l1: "MIGROS",           l2: ""               },
  { l1: "logitech",         l2: ""               },
  { l1: "CLEVERfit",        l2: ""               },
  { l1: "Segmüller",        l2: "Collection"     },
  { l1: "Zahnarztpraxis",   l2: "Papieri"        },
  { l1: "City Pilates",     l2: ""               },
  { l1: "Cham Swiss",       l2: "Properties AG"  },
  { l1: "Käufli",           l2: "Ila Home"       },
  { l1: "Blossom",          l2: "Coffee House"   },
  { l1: "Specialized",      l2: ""               },
  { l1: "Reha-Zentrum",     l2: "Papieri AG"     },
  { l1: "Andy Wickart",     l2: "Haustechnik AG" },
  { l1: "Chomer",           l2: "Bör"            },
  { l1: "Keramik Loft",     l2: "Atelier Kunst"  },
  { l1: "ambrabyte",        l2: "GmbH"           },
  { l1: "Philippe Hubler",  l2: "Fotografie"     },
  { l1: "labeodog",         l2: ""               },
  { l1: "Beyond",           l2: "Tickets"        },
  { l1: "FIDANZA",          l2: ""               },
  { l1: "Silver",           l2: "Reel"           },
  { l1: "AWIAG",             l2: ""               },
];

const descriptions = {
  dock:      "<strong>① Dock-Zoom</strong>Alle Namen immer sichtbar. Der aktive Name vergrössert sich – L1 zuerst, L2 folgt. Graduelle Abstufung der Nachbarn, linearer Durchlauf.",
  grid:      "<strong>② Raster-Highlight</strong>2-Spalten-Raster. Aktive Zelle bleibt in ihrer Spalte – Text überläuft nach rechts. Rechte Spalte gleitet beim Zoom nach links (gleiche Startposition). Partner-Zelle schiebt sich zufällig hoch/runter. Alle 5 Schritte Gesamtübersicht.",
  spotlight: "<strong>③ Spotlight-Scroll</strong>Ein Name dominiert gross im Zentrum, beide Zeilen gleich gross. Vollständig zufällige Auswahl.",
};

// ── State ─────────────────────────────────────────────────────
let currentAnim = 'dock';
let topFixed    = false;
let useRandom   = false;
let dockIdx     = 0;
let gridIdx     = -1;
let spotIdx     = 0;
let gridStep    = 0;
let intervalMs  = 3000;
let mainTimer   = null;
let busy        = false;

// ── Helpers ───────────────────────────────────────────────────
function getList()   { return topFixed ? companies.slice(3) : companies; }
function getScreenH(){ return document.querySelector('.anim-wrapper').clientHeight || 400; }

function nextRandom(cur, max) {
  if (max <= 1) return 0;
  let n; do { n = Math.floor(Math.random() * max); } while (n === cur);
  return n;
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function randDisplace()   { return Math.random() < 0.5 ? '-30px' : '30px'; }

function makeSpans(c) {
  const s1 = document.createElement('span');
  s1.className = 'l1'; s1.textContent = c.l1;
  const s2 = document.createElement('span');
  s2.className = 'l2'; s2.textContent = c.l2;
  if (!c.l2) s2.style.display = 'none';
  return [s1, s2];
}

// ── Build ──────────────────────────────────────────────────────
function buildDock() {
  const el = document.getElementById('anim-dock');
  el.innerHTML = '';
  getList().forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'dock-item'; div.dataset.i = i;
    makeSpans(c).forEach(s => div.appendChild(s));
    el.appendChild(div);
  });
}

function buildGrid() {
  const el = document.getElementById('grid-inner');
  el.innerHTML = '';
  const list = getList();
  for (let i = 0; i < list.length; i += 2) {
    const row = document.createElement('div');
    row.className = 'grid-row'; row.dataset.row = Math.floor(i / 2);

    const lc = document.createElement('div');
    lc.className = 'grid-cell left-cell'; lc.dataset.i = i;
    makeSpans(list[i]).forEach(s => lc.appendChild(s));
    row.appendChild(lc);

    if (i + 1 < list.length) {
      const rc = document.createElement('div');
      rc.className = 'grid-cell right-cell'; rc.dataset.i = i + 1;
      makeSpans(list[i + 1]).forEach(s => rc.appendChild(s));
      row.appendChild(rc);
    }
    el.appendChild(row);
  }
}

function buildSpotlight() {
  const el = document.getElementById('spot-track');
  el.innerHTML = '';
  getList().forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'spot-item'; div.dataset.i = i;
    makeSpans(c).forEach(s => div.appendChild(s));
    el.appendChild(div);
  });
}

// ── Update Dock ───────────────────────────────────────────────
function updateDock(idx) {
  document.querySelectorAll('#anim-dock .dock-item').forEach((el, i) => {
    const d = Math.abs(i - idx);
    el.classList.remove('d0','d1','d2','d3');
    if      (d === 0) el.classList.add('d0');
    else if (d === 1) el.classList.add('d1');
    else if (d === 2) el.classList.add('d2');
    else if (d === 3) el.classList.add('d3');
  });
}

// ── Update Grid ───────────────────────────────────────────────
function clearGridActive() {
  document.querySelectorAll('#grid-inner .grid-cell').forEach(el => {
    el.classList.remove('cell-active', 'cell-displaced');
    el.style.removeProperty('--disp');
  });
}

function activateGridItem(idx) {
  const inner = document.getElementById('grid-inner');
  clearGridActive();
  const activeCell = inner.querySelector(`.grid-cell[data-i="${idx}"]`);
  if (!activeCell) return;

  activeCell.classList.add('cell-active');

  // Partner in same row
  const col = idx % 2;
  const pIdx = col === 0 ? idx + 1 : idx - 1;
  if (pIdx >= 0 && pIdx < getList().length) {
    const pc = inner.querySelector(`.grid-cell[data-i="${pIdx}"]`);
    if (pc) { pc.style.setProperty('--disp', randDisplace()); pc.classList.add('cell-displaced'); }
  }

  // Scroll active row to middle 2/3 of screen
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const rowEl  = activeCell.closest('.grid-row');
    if (!rowEl) return;
    const screenH = getScreenH();
    const innerH  = inner.scrollHeight;
    const rowTop  = rowEl.offsetTop;
    const rowH    = rowEl.offsetHeight;
    const targetY = screenH / 2 - (rowTop + rowH / 2);
    // Constrain: active item stays in middle 2/3 (between 1/6 and 5/6 of screen)
    const hardMin = -(innerH - screenH * (2/3));
    const hardMax = screenH * (1/3);
    inner.style.transform = `translateY(${clamp(targetY, hardMin, hardMax)}px)`;
  }));
}

function updateGrid(newIdx, isOverview) {
  const container = document.getElementById('anim-grid');
  const inner     = document.getElementById('grid-inner');

  if (isOverview) {
    container.classList.add('overview');
    clearGridActive();
    inner.style.transform = 'translateY(0)';
    return;
  }

  // Brief collapse → expand
  container.classList.add('overview');
  clearGridActive();
  setTimeout(() => {
    container.classList.remove('overview');
    activateGridItem(newIdx);
  }, 220);
}

// ── Update Spotlight ──────────────────────────────────────────
function updateSpotlight(idx) {
  const track = document.getElementById('spot-track');
  const items = track.querySelectorAll('.spot-item');
  items.forEach((el, i) => {
    const d = Math.abs(i - idx);
    el.classList.remove('sp-active','sp-near','sp-mid');
    if      (i === idx) el.classList.add('sp-active');
    else if (d === 1)   el.classList.add('sp-near');
    else if (d <= 3)    el.classList.add('sp-mid');
  });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const activeEl = track.querySelector('.spot-item.sp-active');
    if (!activeEl) return;
    const screenH  = getScreenH();
    const trackH   = track.scrollHeight;
    const targetY  = screenH / 2 - activeEl.offsetTop - activeEl.offsetHeight / 2;
    const hardMin  = -(trackH - screenH * (2/3));
    const hardMax  = screenH * (1/3);
    track.style.transform = `translateY(${clamp(targetY, hardMin, hardMax)}px)`;
  }));
}

// ── Tick ──────────────────────────────────────────────────────
function tick() {
  if (busy) return;
  const n = getList().length;

  const nextIdx = (cur) => useRandom ? nextRandom(cur, n) : (cur + 1) % n;

  if (currentAnim === 'dock') {
    dockIdx = nextIdx(dockIdx);
    updateDock(dockIdx);

  } else if (currentAnim === 'grid') {
    gridStep++;
    if (gridStep % 5 === 0) {
      busy = true;
      updateGrid(-1, true);
      setTimeout(() => { gridIdx = nextIdx(gridIdx); updateGrid(gridIdx, false); busy = false; }, 1400);
    } else {
      gridIdx = nextIdx(gridIdx);
      updateGrid(gridIdx, false);
    }

  } else if (currentAnim === 'spotlight') {
    spotIdx = nextIdx(spotIdx);
    updateSpotlight(spotIdx);
  }
}

// ── Switch / Speed / Top-Fixed ────────────────────────────────
function switchAnim(name, btn) {
  currentAnim = name; busy = false;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');

  document.getElementById('anim-dock').style.display      = name === 'dock'      ? 'flex'  : 'none';
  document.getElementById('anim-grid').style.display      = name === 'grid'      ? 'block' : 'none';
  document.getElementById('anim-spotlight').style.display = name === 'spotlight' ? 'block' : 'none';
  document.getElementById('desc-card').innerHTML = descriptions[name];

  resetAnim(name);
  restartTimer();
}

function toggleRandom(checked) {
  useRandom = checked;
}

function toggleTopFixed(checked) {
  topFixed = checked;
  document.getElementById('top-banner').style.display = checked ? 'block' : 'none';
  buildDock(); buildGrid(); buildSpotlight();
  resetAnim(currentAnim);
}

function resetAnim(name) {
  const n = getList().length;
  if (name === 'dock') {
    dockIdx = 0; updateDock(0);
  } else if (name === 'grid') {
    gridStep = 0; gridIdx = -1;
    document.getElementById('anim-grid').classList.add('overview');
    clearGridActive();
    document.getElementById('grid-inner').style.transform = '';
    busy = true;
    setTimeout(() => { gridIdx = 0; updateGrid(0, false); busy = false; }, 700);
  } else if (name === 'spotlight') {
    spotIdx = 0; updateSpotlight(0);
  }
}

function setSpeed(ms, btn) {
  intervalMs = ms;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  restartTimer();
}

function restartTimer() {
  if (mainTimer) clearInterval(mainTimer);
  mainTimer = setInterval(tick, intervalMs);
}

// ── Init ──────────────────────────────────────────────────────
buildDock(); buildGrid(); buildSpotlight();

updateDock(0);
document.getElementById('anim-grid').classList.add('overview');
setTimeout(() => updateGrid(0, false), 600);
updateSpotlight(0);

document.getElementById('anim-grid').style.display      = 'none';
document.getElementById('anim-spotlight').style.display = 'none';
document.getElementById('anim-dock').style.display      = 'flex';

restartTimer();
</script>
</body>
